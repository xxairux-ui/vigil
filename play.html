<script>
  // Not unlocked here (no service worker in charge): the gate first.
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) location.replace('./');
  // A newer version has taken over (it installs in the background as the app opens): move to it at the title
  // screen, never mid-night.
  else {
    let updated = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => (updated = true));
    setInterval(() => {
      const state = window.vigil && window.vigil.state;
      if (updated && (state === 'title' || state === 'loading' || !state)) location.reload();
    }, 1500);
  }
</script>

      (function () {
        var seen = [];
        function report(text) {
          text = String(text || 'Unknown error').slice(0, 600);
          if (seen.indexOf(text) >= 0 || seen.length >= 4) return;
          seen.push(text);
          var panel = document.querySelector('.error-report');
          if (!panel) {
            panel = document.createElement('div');
            panel.className = 'error-report';
            panel.addEventListener('click', function () {
              panel.hidden = true;
            });
            document.body.appendChild(panel);
          }
          panel.hidden = false;
          panel.textContent = seen.join('\n\n') + '\n\n' + navigator.userAgent;
        }
        addEventListener('error', function (e) {
          report(e.error && e.error.stack ? e.error.stack : e.message);
        });
        addEventListener('unhandledrejection', function (e) {
          report(e.reason && e.reason.stack ? e.reason.stack : e.reason);
        });
      })();
    </script>

<script>
  // Not unlocked here (no service worker in charge): the gate first.
  if (!navigator.serviceWorker || !navigator.serviceWorker.controller) location.replace('./');
  else {
    const sw = navigator.serviceWorker;
    const state = () => window.vigil && window.vigil.state;
    // Only at the title (never mid-night) may a newer version take over this page.
    const idle = () => !state() || state() === 'title' || state() === 'loading';
    // A newer version asks every open copy first, and waits while any is mid-night.
    sw.addEventListener('message', (e) => {
      if (e.data === 'state?' && e.ports[0]) e.ports[0].postMessage(idle() ? 'idle' : 'busy');
    });
    let updated = false;
    sw.addEventListener('controllerchange', () => (updated = true));
    let fill = 0;
    setInterval(async () => {
      // The rest of the game's files, kept for playing offline: the worker fetches them in the background once the
      // title is up (the courts and heroes first), and looks again now and then for any still missing.
      if (state() && state() !== 'loading' && Date.now() > fill && sw.controller) {
        sw.controller.postMessage('precache');
        fill = Date.now() + 120000;
      }
      if (!idle()) return;
      // A newer version has taken over: move to it.
      if (updated) return location.reload();
      // One installed and waiting: let it take over.
      const reg = await sw.getRegistration();
      if (reg && reg.waiting && reg.active) reg.waiting.postMessage('skip');
    }, 1500);
  }
</script>

<script>document.body.classList.add('vigil')</script>
<canvas id="vigil"></canvas>
    <!-- The one word shown before any script runs; main.ts writes it again in the chosen language. -->
    <div id="loading" class="loading">Loading…</div>
    <!-- Over everything while a phone is held upright (vigil.css .turn-notice); main.ts writes it in the chosen language. -->
    <div id="turn" class="turn-notice">
      <div class="turn-name">Vigil</div>
      <p class="turn-line">Turn your phone on its side to play.</p>
    </div>
    <script>
      (function () {
        var seen = [];
        function report(text) {
          text = String(text || 'Unknown error').slice(0, 600);
          if (seen.indexOf(text) >= 0 || seen.length >= 4) return;
          seen.push(text);
          var panel = document.querySelector('.error-report');
          if (!panel) {
            panel = document.createElement('div');
            panel.className = 'error-report';
            panel.addEventListener('click', function () {
              panel.hidden = true;
            });
            document.body.appendChild(panel);
          }
          panel.hidden = false;
          panel.textContent = seen.join('\n\n') + '\n\n' + navigator.userAgent;
        }
        addEventListener('error', function (e) {
          report(e.error && e.error.stack ? e.error.stack : e.message);
        });
        addEventListener('unhandledrejection', function (e) {
          report(e.reason && e.reason.stack ? e.reason.stack : e.reason);
        });
      })();
    </script>
